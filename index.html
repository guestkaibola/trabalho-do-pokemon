
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">

    <title>Buscar Pokémon</title>
</head>

<body>

    <main class="container">

        <h1>⚡ Pokédex</h1>

        <p class="subtitulo">
            Descubra informações sobre seu Pokémon favorito!
        </p>

        <form id="formPoke">

            <input
                type="number"
                id="idPoke"
                placeholder="Digite o ID do Pokémon"
                min="1"
                required
            >

            <button type="submit">Buscar Pokémon</button>

        </form>

        <p id="msg"></p>

        <div id="resultado" class="card">

            <h2 id="nomePokemon"></h2>

            <img
                src=""
                alt="Imagem do Pokémon"
                id="imgPoke"
            >

            <div class="informacoes">

                <p>⭐ Experiência: <span id="basePoke"></span></p>

                <p>📏 Altura: <span id="alturaPoke"></span></p>

                <p>⚖️ Peso: <span id="pesoPoke"></span></p>

                <p>🆔 ID: <span id="idPokemon"></span></p>

            </div>

        </div>

    </main>

    <script src="main.js"></script>

</body>
</html>
